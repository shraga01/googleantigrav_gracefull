<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#FDF6EE"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F"/>
      <stop offset="50%" stop-color="#F4A261"/>
      <stop offset="100%" stop-color="#E9C46A"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A9D8F"/>
      <stop offset="100%" stop-color="#81B29A"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="128" fill="url(#warmBg)"/>

  <!-- Outer radiant circle (Maskable safe zone) -->
  <circle cx="256" cy="256" r="180" fill="url(#sunGrad)" filter="url(#softGlow)" opacity="0.95"/>

  <!-- Gratitude lotus / rays center -->
  <g transform="translate(256, 256)">
    <!-- Central warm heart / light -->
    <path d="M 0, -80 C 45, -80 80, -45 80, 0 C 80, 55 0, 110 0, 110 C 0, 110 -80, 55 -80, 0 C -80, -45 -45, -80 0, -80 Z" 
          fill="#FFFDF7" opacity="0.95"/>
    <!-- Gentle rising leaf -->
    <path d="M 0, 10 C 30, -20 60, 10 30, 45 C 10, 65 0, 80 0, 80 C 0, 80 -10, 65 -30, 45 C -60, 10 -30, -20 0, 10 Z" 
          fill="url(#leafGrad)" opacity="0.9"/>
  </g>
</svg>
